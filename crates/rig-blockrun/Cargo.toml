[package]
name = "rig-blockrun"
version.workspace = true
edition.workspace = true
license = "MIT"
readme = "README.md"
description = "BlockRun account API and x402 provider for Rig integration."

[lints]
workspace = true

[features]
# TLS, on the same axis as `rig-reqwest`: the workspace pins reqwest with
# `default-features = false`, so without one of these there is no TLS stack in
# the tree at all and every request to the gateway fails at the transport. The
# stacks are additive rather than exclusive, matching `rig-reqwest`'s own
# documentation of the pair.
default = ["rustls"]
rustls = ["rig-reqwest/rustls"]
native-tls = ["rig-reqwest/native-tls"]

[dependencies]
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false }
# Depended on for the TLS feature forwarding above; this crate drives reqwest
# directly because x402 is a probe-then-sign flow rather than a plain request.
rig-reqwest = { path = "../rig-reqwest", version = "0.42.0", default-features = false }
async-stream = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
hex = "0.4"
http = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.9"
reqwest = { workspace = true, features = ["json", "stream"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha3 = "0.10"
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
rig-agent = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }
